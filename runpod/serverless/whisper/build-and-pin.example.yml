# Example GitHub Actions workflow: build the worker on every push that changes
# it, push it to GHCR, and pin the RunPod endpoint to the new digest.
# Copy to .github/workflows/ in your own repo and adjust the paths.
#
# Secrets: RUNPOD_API_KEY. GHCR auth uses the job's GITHUB_TOKEN. The spec
# (endpoint.json) is committed: it names the template and endpoint and holds no
# secrets (those go in envFromShell or RunPod secrets).
# The image is about 6 GB; the standard hosted runner has room for it.

name: whisper-worker

on:
  push:
    branches: [main]
    paths:
      - runpod/serverless/whisper/**
  workflow_dispatch:

# A newer push cancels an older build: only the latest image matters. A cancel
# between the push and the pin leaves the endpoint on the previous digest until
# the newer run pins its own.
concurrency:
  group: whisper-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR wants a lowercase repository path, and owner names can have capitals
      - id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/whisper-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: runpod/serverless/whisper
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.repo.outputs.image }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.repo.outputs.image }}:buildcache,mode=max

      # Inputs go through env, never interpolated into the script (GitHub's
      # injection guidance).
      - name: Pin the endpoint to the new digest
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          IMAGE: ${{ steps.repo.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          python3 runpod/serverless/deploy/runpod_deploy.py pin \
            runpod/serverless/whisper/endpoint.json "${IMAGE}"
